{% extends 'base.html' %}

{% block title %}Voz Senac | Enviar contribuição{% endblock %}

{% block content %}
<section class="form-section">
  <h1>Compartilhe uma ideia ou necessidade</h1>
  <form method="POST" class="form-card">
    <fieldset>
      <legend>Sobre você</legend>

      <div class="field-group">
        <label for="nome">Nome ou identificação</label>
        <input type="text" id="nome" name="nome" required placeholder="Como podemos identificar você?" />
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="curso">Curso ou área</label>
          <input type="text" id="curso" name="curso" required placeholder="Ex.: Técnico em Administração" />
        </div>

        <div class="field-group">
          <label for="unidade">Unidade, turma ou turno</label>
          <input type="text" id="unidade" name="unidade" required placeholder="Ajude a contextualizar sua contribuição" />
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Sua contribuição</legend>

      <div class="field-group">
        <label for="titulo">Assunto</label>
        <input type="text" id="titulo" name="titulo" required placeholder="Ex.: Mais tomadas na sala de estudos" />
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="categoria">Categoria</label>
          <select id="categoria" name="categoria" required>
            <option value="">Selecione</option>
            {% for categoria in categorias %}
              <option value="{{ categoria }}">{{ categoria }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="field-group">
          <label for="status">Status</label>
          <select id="status" name="status" required>
            {% for status in statuses %}
              <option value="{{ status }}">{{ status }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="field-group">
        <label for="descricao">Conte o que aconteceu ou o que pode melhorar</label>
        <textarea id="descricao" name="descricao" rows="6" required placeholder="Dê detalhes que ajudem a comunidade a entender sua ideia ou necessidade..."></textarea>
      </div>
    </fieldset>

    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Publicar contribuição</button>
      <a class="btn btn-secondary" href="{{ url_for('suggestions') }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
